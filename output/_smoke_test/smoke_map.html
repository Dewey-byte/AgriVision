        }).addTo(map).bindPopup('GPS accuracy radius');
      }

      if (payload.fieldBounds) {
        window.agriVisionSetFieldBounds && window.agriVisionSetFieldBounds(payload.fieldBounds);
      }

      if (heatLayer == null) {
        heatLayer = L.heatLayer([], {
        radius: 22,
        blur: 18,
        maxZoom: 18,
        minOpacity: 0.35,
        gradient: {
          0.0: '#40916c',
          0.45: '#d4a373',
          1.0: '#bc4749'
        }
      }).addTo(map);
      }
      heatLayer.setLatLngs(heatPoints);

      markerLayer.clearLayers();
      markers.forEach(m => {
        const c = colors[m.category] || '#40916c';
        L.circleMarker([m.lat, m.lon], {
          radius: 6,
          color: c,
          fillColor: c,
          fillOpacity: 0.85,
          weight: 2
        }).addTo(markerLayer).bindPopup('<b>' + m.label + '</b><br>' + (m.category || '') +
          (m.confidence != null ? '<br>conf: ' + Number(m.confidence).toFixed(2) : ''));
      });

      if (!hasFitBounds && payload.fieldBounds) {
        try {
          const b = payload.fieldBounds;
          map.fitBounds([[b.south, b.west], [b.north, b.east]], { padding: [20, 20] });
          hasFitBounds = true;
        } catch (e) {}
      } else if (!hasFitBounds && (heatPoints.length || markers.length)) {
        try {
          const bounds = extendBounds(L.latLngBounds([]), heatPoints, markers);
          map.fitBounds(bounds.pad(0.15));
          hasFitBounds = true;
        } catch (e) {}
      }
    };

    

    window.agriVisionUpdateMap(initialPayload);
    if (initialPayload.fieldBounds) {
      window.agriVisionSetFieldBounds(initialPayload.fieldBounds);
    }
  </script>
</body>
</html>
